---
name: ci

"on":
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-unit:
    uses: sous-chefs/.github/.github/workflows/lint-unit.yml@9.0.0
    with:
      gems: chef-cli docker-api
    permissions:
      actions: write
      checks: write
      pull-requests: write
      statuses: write
      issues: write

  matrix:
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.kitchen.outputs.instances }}
    steps:
      - uses: actions/checkout@v7
      - uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - id: kitchen
        name: Read the Kitchen matrix
        run: |
          chef exec ruby -rjson -ryaml -e '
            config = YAML.load_file("kitchen.yml")
            instances = config.fetch("suites").product(config.fetch("platforms")).map do |suite, platform|
              "#{suite.fetch("name")}-#{platform.fetch("name").delete(".")}"
            end
            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |file| file.puts "instances=#{JSON.generate(instances)}" }
          '

  integration:
    needs: [lint-unit, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(needs.matrix.outputs.instances) }}
    steps:
      - uses: actions/checkout@v7
      - uses: sous-chefs/.github/.github/actions/install-workstation@9.0.0
      - name: Test Kitchen
        env:
          CHEF_LICENSE: accept-no-persist
          KITCHEN_LOCAL_YAML: kitchen.dokken.yml
        run: kitchen test "^${{ matrix.instance }}$" --destroy=always
      - name: Kitchen logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kitchen-${{ matrix.instance }}
          path: .kitchen/logs/
